<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Environment Variables</title>
</head>
<body>
    <h1>Test Environment Variables</h1>
    <div id="output"></div>

    <script type="module">
        const output = document.getElementById('output');
        
        // Тестируем переменные окружения
        const env = import.meta.env;
        
        output.innerHTML = `
            <h2>Environment Variables Test</h2>
            <p><strong>MODE:</strong> ${env.MODE}</p>
            <p><strong>DEV:</strong> ${env.DEV}</p>
            <p><strong>PROD:</strong> ${env.PROD}</p>
            <p><strong>BASE_URL:</strong> ${env.BASE_URL}</p>
            <p><strong>VITE_SUPABASE_URL:</strong> ${env.VITE_SUPABASE_URL || 'UNDEFINED'}</p>
            <p><strong>VITE_SUPABASE_ANON_KEY:</strong> ${env.VITE_SUPABASE_ANON_KEY ? 'PRESENT' : 'MISSING'}</p>
            
            <h3>All VITE_ variables:</h3>
            <ul>
                ${Object.keys(env).filter(key => key.startsWith('VITE_')).map(key => 
                    `<li><strong>${key}:</strong> ${env[key] || 'undefined'}</li>`
                ).join('')}
            </ul>
            
            <h3>All environment variables:</h3>
            <ul>
                ${Object.keys(env).map(key => 
                    `<li><strong>${key}:</strong> ${env[key] || 'undefined'}</li>`
                ).join('')}
            </ul>
        `;
        
        console.log('🔍 Environment variables test:', env);
    </script>
</body>
</html>
