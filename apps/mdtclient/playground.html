<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDT Component Playground</title>
    <script src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .component-section {
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .component-title {
            color: #60a5fa;
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 10px;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            padding: 8px 16px;
            margin: 4px;
        }
        .button-primary {
            background-color: #3b82f6;
            color: white;
        }
        .button-primary:hover {
            background-color: #2563eb;
        }
        .button-secondary {
            background-color: #64748b;
            color: white;
        }
        .button-secondary:hover {
            background-color: #475569;
        }
        .button-danger {
            background-color: #ef4444;
            color: white;
        }
        .button-danger:hover {
            background-color: #dc2626;
        }
        .button-ghost {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
        }
        .button-ghost:hover {
            background-color: #334155;
        }
        .button-outline {
            background-color: transparent;
            color: #60a5fa;
            border: 1px solid #3b82f6;
        }
        .button-outline:hover {
            background-color: #1e40af;
            color: white;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }
        .card-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f1f5f9;
        }
        .card-content {
            color: #94a3b8;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            margin: 2px;
        }
        .badge-primary {
            background-color: #3b82f6;
            color: white;
        }
        .badge-success {
            background-color: #10b981;
            color: white;
        }
        .badge-warning {
            background-color: #f59e0b;
            color: white;
        }
        .badge-danger {
            background-color: #ef4444;
            color: white;
        }
        .input {
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            padding: 8px 12px;
            width: 100%;
            margin: 4px 0;
        }
        .input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #475569;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #94a3b8;
        }
        .tab.active {
            color: #60a5fa;
            border-bottom-color: #3b82f6;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Playground() {
            const [activeTab, setActiveTab] = useState('buttons');

            return (
                <div className="container mx-auto p-8">
                    <h1 className="text-3xl font-bold mb-8 text-center text-blue-400">
                        🎨 MDT Component Playground
                    </h1>
                    
                    <div className="tabs">
                        <div 
                            className={`tab ${activeTab === 'buttons' ? 'active' : ''}`}
                            onClick={() => setActiveTab('buttons')}
                        >
                            Кнопки
                        </div>
                        <div 
                            className={`tab ${activeTab === 'cards' ? 'active' : ''}`}
                            onClick={() => setActiveTab('cards')}
                        >
                            Карточки
                        </div>
                        <div 
                            className={`tab ${activeTab === 'badges' ? 'active' : ''}`}
                            onClick={() => setActiveTab('badges')}
                        >
                            Бейджи
                        </div>
                        <div 
                            className={`tab ${activeTab === 'inputs' ? 'active' : ''}`}
                            onClick={() => setActiveTab('inputs')}
                        >
                            Поля ввода
                        </div>
                        <div 
                            className={`tab ${activeTab === 'layout' ? 'active' : ''}`}
                            onClick={() => setActiveTab('layout')}
                        >
                            Макеты
                        </div>
                    </div>

                    <div className={`tab-content ${activeTab === 'buttons' ? 'active' : ''}`}>
                        <div className="component-section">
                            <h2 className="component-title">Кнопки</h2>
                            <div>
                                <button className="button button-primary">Primary</button>
                                <button className="button button-secondary">Secondary</button>
                                <button className="button button-danger">Danger</button>
                                <button className="button button-ghost">Ghost</button>
                                <button className="button button-outline">Outline</button>
                            </div>
                            <div style={{marginTop: '20px'}}>
                                <button className="button button-primary" style={{padding: '4px 8px', fontSize: '0.875rem'}}>Small</button>
                                <button className="button button-primary">Medium</button>
                                <button className="button button-primary" style={{padding: '12px 24px', fontSize: '1.125rem'}}>Large</button>
                            </div>
                        </div>
                    </div>

                    <div className={`tab-content ${activeTab === 'cards' ? 'active' : ''}`}>
                        <div className="component-section">
                            <h2 className="component-title">Карточки</h2>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '20px'}}>
                                <div className="card">
                                    <div className="card-header">Заголовок карточки</div>
                                    <div className="card-content">
                                        Это содержимое карточки с описанием компонента или данных.
                                    </div>
                                </div>
                                <div className="card">
                                    <div className="card-header">Карточка с действиями</div>
                                    <div className="card-content">
                                        <p>Карточка с кнопками действий внизу.</p>
                                        <div style={{marginTop: '15px'}}>
                                            <button className="button button-primary">Действие</button>
                                            <button className="button button-ghost">Отмена</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={`tab-content ${activeTab === 'badges' ? 'active' : ''}`}>
                        <div className="component-section">
                            <h2 className="component-title">Бейджи</h2>
                            <div>
                                <span className="badge badge-primary">Primary</span>
                                <span className="badge badge-success">Success</span>
                                <span className="badge badge-warning">Warning</span>
                                <span className="badge badge-danger">Danger</span>
                            </div>
                            <div style={{marginTop: '20px'}}>
                                <h3 style={{color: '#60a5fa', marginBottom: '10px'}}>Статусы</h3>
                                <span className="badge badge-success">Активен</span>
                                <span className="badge badge-warning">В ожидании</span>
                                <span className="badge badge-danger">Заблокирован</span>
                                <span className="badge badge-primary">Новый</span>
                            </div>
                        </div>
                    </div>

                    <div className={`tab-content ${activeTab === 'inputs' ? 'active' : ''}`}>
                        <div className="component-section">
                            <h2 className="component-title">Поля ввода</h2>
                            <div style={{maxWidth: '400px'}}>
                                <label style={{display: 'block', marginBottom: '5px', color: '#f1f5f9'}}>
                                    Обычное поле
                                </label>
                                <input type="text" className="input" placeholder="Введите текст..." />
                                
                                <label style={{display: 'block', marginBottom: '5px', color: '#f1f5f9', marginTop: '15px'}}>
                                    Email
                                </label>
                                <input type="email" className="input" placeholder="email@example.com" />
                                
                                <label style={{display: 'block', marginBottom: '5px', color: '#f1f5f9', marginTop: '15px'}}>
                                    Пароль
                                </label>
                                <input type="password" className="input" placeholder="Введите пароль" />
                                
                                <label style={{display: 'block', marginBottom: '5px', color: '#f1f5f9', marginTop: '15px'}}>
                                    Текстовая область
                                </label>
                                <textarea className="input" rows="4" placeholder="Введите многострочный текст..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div className={`tab-content ${activeTab === 'layout' ? 'active' : ''}`}>
                        <div className="component-section">
                            <h2 className="component-title">Макеты</h2>
                            <div style={{display: 'grid', gridTemplateColumns: '1fr 2fr', gap: '20px', marginBottom: '20px'}}>
                                <div className="card">
                                    <div className="card-header">Боковая панель</div>
                                    <div className="card-content">
                                        Навигация и меню
                                    </div>
                                </div>
                                <div className="card">
                                    <div className="card-header">Основной контент</div>
                                    <div className="card-content">
                                        Основная область приложения
                                    </div>
                                </div>
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px'}}>
                                <div className="card">
                                    <div className="card-header">Колонка 1</div>
                                    <div className="card-content">
                                        Содержимое первой колонки
                                    </div>
                                </div>
                                <div className="card">
                                    <div className="card-header">Колонка 2</div>
                                    <div className="card-content">
                                        Содержимое второй колонки
                                    </div>
                                </div>
                                <div className="card">
                                    <div className="card-header">Колонка 3</div>
                                    <div className="card-content">
                                        Содержимое третьей колонки
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Playground />, document.getElementById('root'));
    </script>
</body>
</html>
