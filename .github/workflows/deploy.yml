name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: |
          cd apps/client
          npm ci

      - name: Install mdtclient dependencies
        run: |
          cd apps/mdtclient
          npm ci

      - name: Install server dependencies
        run: |
          cd apps/server
          npm ci

      - name: Install shared libraries dependencies
        run: |
          cd libs/shared-types
          npm ci
          cd ../shared-utils
          npm ci

      - name: Build application
        run: npm run build:production

      - name: Install production dependencies
        run: npm ci --production

      - name: Create deployment package
        run: |
          tar -czf deployment.tar.gz \
            dist/ \
            client/ \
            shared/ \
            vite.config.ts \
            tailwind.config.ts \
            package.json \
            package-lock.json \
            scripts/ \
            public/ \
            supabase/ \
            migrations/ \
            docs/ \
            README.md \
            node_modules/

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "deployment.tar.gz"
          target: "/var/www/app"
          strip_components: 0

      - name: Setup and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/app
            tar -xzf deployment.tar.gz

            echo "🔍 Проверяем .env файл..."
            if [ -f .env ]; then
              echo "✅ .env файл найден"
              head -3 .env
            else
              echo "❌ .env файл не найден"
              exit 1
            fi

            # Безопасный рестарт через PM2
            if pm2 list | grep -q "roleplayidentity"; then
              echo "🔄 Релоадим приложение через pm2..."
              pm2 reload roleplayidentity
            else
              echo "🚀 Первый старт приложения через pm2..."
              NODE_ENV=production pm2 start dist/server.js --name roleplayidentity
            fi

            pm2 save

            echo "📊 Статус приложения:"
            pm2 status

            rm -f deployment.tar.gz
            echo "✅ Деплой завершен успешно!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 5
            pm2 status

            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "✅ Приложение доступно на localhost:5000"
            else
              echo "❌ Приложение недоступно на localhost:5000"
              echo "📋 Последние 10 строк логов PM2:"
              pm2 logs roleplayidentity --lines 10 --nostream
              exit 1
            fi
