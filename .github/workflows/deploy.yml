name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Install dependencies in shared libraries
        run: |
          echo "🔧 Устанавливаем зависимости в shared библиотеках..."
          cd libs/shared/schema && npm install
          cd ../../..

      - name: Create .env file for Vite build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "Создан .env файл для сборки фронтенда:"
          cat .env

      - name: Run module diagnostics
        run: |
          echo "🔍 Запускаем диагностику модулей..."
          npm run check-modules

      - name: Build application
        run: npm run build:production

      - name: Verify build artifacts and check for zod
        run: |
          echo "📋 Проверяем наличие билд-артефактов..."
          
          # Проверяем, что главный файл сервера существует по реальному пути
          if [ ! -f "dist/apps/server/main.js" ]; then
            echo "❌ КРИТИЧЕСКАЯ ОШИБКА: Файл сервера dist/apps/server/main.js не найден!"
            echo "--- Структура директории dist: ---"
            ls -R dist
            exit 1
          fi
          
          echo "✅ Все билд-артефакты найдены."
          
          # Проверяем наличие zod в собранных файлах
          echo "🔍 Проверяем наличие zod в собранных файлах..."
          
          if find dist/apps/client/js -name "*.js" -exec grep -l "zod" {} \; | head -1; then
            echo "✅ zod найден в собранных файлах клиента"
          else
            echo "⚠️  zod не найден в собранных файлах клиента"
          fi
          
          if find dist/apps/mdtclient/js -name "*.js" -exec grep -l "zod" {} \; | head -1; then
            echo "✅ zod найден в собранных файлах MDT"
          else
            echo "⚠️  zod не найден в собранных файлах MDT"
          fi
          
          # Проверяем наличие zod-vendor файла
          if find dist -name "*zod*" -type f; then
            echo "✅ zod-vendor файл найден"
          else
            echo "⚠️  zod-vendor файл не найден"
          fi
          
          ls -R dist

      - name: Clean up node_modules before deploy
        run: rm -rf node_modules

      - name: Deploy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # Должен быть 'daniel'
          key: ${{ secrets.DEPLOY_KEY }}
          source: "." # Копируем всю текущую директорию (без node_modules)
          target: "/var/www/app"
          overwrite: true

      - name: Install dependencies and restart application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Переходим в рабочую директорию
            cd /var/www/app

            # Устанавливаем production-зависимости
            echo "🔧 Устанавливаем зависимости..."
            npm install --production
            
            # Устанавливаем зависимости в shared библиотеке
            echo "🔧 Устанавливаем зависимости в shared/schema..."
            cd libs/shared/schema && npm install && cd ../../../

            # ВОТ ФИНАЛЬНЫЙ КЛЮЧ: ВОССТАНАВЛИВАЕМ ССЫЛКУ ПОСЛЕ КОПИРОВАНИЯ
            echo "🔗 Восстанавливаем символическую ссылку на .env файл..."
            # Используем абсолютный путь для 100% надежности
            # -f означает --force, он перезапишет ссылку, если она вдруг осталась
            ln -sf /var/www/.env .env

            # Проверяем наличие zod в собранных файлах на сервере
            echo "🔍 Проверяем наличие zod в собранных файлах на сервере..."
            if find dist/apps/client/js -name "*.js" -exec grep -l "zod" {} \; | head -1; then
              echo "✅ zod найден в собранных файлах клиента на сервере"
            else
              echo "❌ zod НЕ найден в собранных файлах клиента на сервере"
            fi
            
            if find dist -name "*zod*" -type f; then
              echo "✅ zod-vendor файл найден на сервере"
            else
              echo "❌ zod-vendor файл НЕ найден на сервере"
            fi

            # Теперь запускаем PM2, который найдет .env по этой ссылке
            echo "🚀 Запускаем/перезапускаем приложение через ecosystem.config.js..."
            pm2 startOrGracefulReload ecosystem.config.js --env production
            
            pm2 save
            echo "✅ Деплой завершен успешно!"

      - name: Health check and module verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 5 # Даем приложению время на запуск
            
            echo "📊 Проверяем статус PM2..."
            pm2 status

            echo "🩺 Проверяем Health Check endpoint..."
            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "✅ Приложение доступно и отвечает на health check!"
            else
              echo "❌ Приложение НЕ отвечает на health check."
              echo "📋 Последние 20 строк логов PM2:"
              pm2 logs roleplayidentity --lines 20 --nostream
              exit 1
            fi
            
            echo "🔍 Проверяем доступность статических файлов..."
            if curl -f http://localhost:5000/ > /dev/null 2>&1; then
              echo "✅ Статические файлы клиента доступны!"
            else
              echo "⚠️  Статические файлы клиента недоступны"
            fi
            
            echo "🔍 Проверяем доступность MDT..."
            if curl -f http://localhost:5000/mdt/ > /dev/null 2>&1; then
              echo "✅ MDT интерфейс доступен!"
            else
              echo "⚠️  MDT интерфейс недоступен"
            fi
            
            echo "📋 Финальная проверка структуры файлов:"
            ls -la dist/apps/client/js/ | head -10
            echo "..."
            ls -la dist/apps/mdtclient/js/ | head -10