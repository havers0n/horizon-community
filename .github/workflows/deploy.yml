name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies (workspace)
        run: npm ci

      - name: Install shared libraries dependencies
        run: |
          # Для npm workspace все зависимости уже установлены в корне
          # Проверяем что workspace пакеты доступны
          echo "Checking workspace packages..."
          ls -la libs/shared-types/
          ls -la libs/shared-utils/
          ls -la libs/shared/schema/

      - name: Build application
        run: npm run build:production

      - name: Verify workspace packages
        run: |
          echo "Verifying workspace packages are available..."
          npm ls --workspaces --depth=0

      - name: List workspace files
        run: |
          echo "Current directory:"
          pwd
          echo "Root directory contents:"
          ls -la
          echo "Nx dist structure:"
          ls -la dist/ 2>/dev/null || echo "Root dist not found"
          echo "Nx apps dist:"
          ls -la dist/apps/ 2>/dev/null || echo "dist/apps not found"
          echo "Server build:"
          ls -la dist/apps/server/ 2>/dev/null || echo "dist/apps/server not found"
          echo "Client build:"
          ls -la dist/apps/client/ 2>/dev/null || echo "dist/apps/client not found"
          echo "MDT client build:"
          ls -la dist/apps/mdtclient/ 2>/dev/null || echo "dist/apps/mdtclient not found"

      - name: Create deployment package
        run: |
          # Используем умный скрипт для правильного архивирования
          npm run build:archive:correct
          
          # Проверяем, что архив создан
          if [ ! -f deployment.tar.gz ]; then
            echo "❌ Архив deployment.tar.gz не был создан"
            echo "📋 Содержимое текущей директории:"
            ls -la
            echo "📋 Проверяем наличие билд-артефактов:"
            ls -la dist/ 2>/dev/null || echo "dist/ не найден"
            ls -la apps/*/dist/ 2>/dev/null || echo "apps/*/dist/ не найдены"
            exit 1
          fi
          
          echo "✅ Архив deployment.tar.gz создан успешно"
          ls -lh deployment.tar.gz

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "deployment.tar.gz"
          target: "/var/www/app"
          strip_components: 0

      - name: Setup and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/app
            tar -xzf deployment.tar.gz

            echo "🔍 Проверяем .env файл..."
            if [ -f .env ]; then
              echo "✅ .env файл найден"
              head -3 .env
            else
              echo "❌ .env файл не найден"
              exit 1
            fi

            # Безопасный рестарт через PM2
            if pm2 list | grep -q "roleplayidentity"; then
              echo "🔄 Релоадим приложение через pm2..."
              pm2 reload roleplayidentity
            else
              echo "🚀 Первый старт приложения через pm2..."
              NODE_ENV=production pm2 start dist/apps/server/index.js --name roleplayidentity
            fi

            pm2 save

            echo "📊 Статус приложения:"
            pm2 status

            rm -f deployment.tar.gz
            echo "✅ Деплой завершен успешно!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 5
            pm2 status

            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "✅ Приложение доступно на localhost:5000"
            else
              echo "❌ Приложение недоступно на localhost:5000"
              echo "📋 Последние 10 строк логов PM2:"
              pm2 logs roleplayidentity --lines 10 --nostream
              exit 1
            fi
