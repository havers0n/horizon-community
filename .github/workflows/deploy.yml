name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies (workspace)
        run: npm ci

      - name: Install shared libraries dependencies
        run: |
          # Для npm workspace все зависимости уже установлены в корне
          # Проверяем что workspace пакеты доступны
          echo "Checking workspace packages..."
          ls -la libs/shared-types/
          ls -la libs/shared-utils/
          ls -la libs/shared/schema/

      - name: Build application
        run: npm run build:production

      - name: Verify workspace packages
        run: |
          echo "Verifying workspace packages are available..."
          npm ls --workspaces --depth=0

      - name: List workspace files
        run: |
          echo "Current directory:"
          pwd
          echo "Root directory contents:"
          ls -la
          echo "Nx dist structure:"
          ls -la dist/ 2>/dev/null || echo "Root dist not found"
          echo "Nx apps dist:"
          ls -la dist/apps/ 2>/dev/null || echo "dist/apps not found"
          echo "Server build:"
          ls -la dist/apps/server/ 2>/dev/null || echo "dist/apps/server not found"
          echo "Client build:"
          ls -la dist/apps/client/ 2>/dev/null || echo "dist/apps/client not found"
          echo "MDT client build:"
          ls -la dist/apps/mdtclient/ 2>/dev/null || echo "dist/apps/mdtclient not found"

      - name: Verify build artifacts
        run: |
          echo "📋 Проверяем наличие билд-артефактов:"
          
          if [ ! -d "dist/apps/client" ] || [ ! -d "dist/apps/mdtclient" ] || [ ! -f "dist/apps/server/main.js" ]; then
            echo "❌ Один или несколько билд-артефактов не найдены!"
            echo "--- Структура директории dist: ---"
            ls -R dist 2>/dev/null || echo "dist/ не найден"
            exit 1
          fi
          
          echo "✅ Все билд-артефакты найдены."
          echo "--- Размеры билдов: ---"
          du -sh dist/apps/*

      - name: Manual SSH Connection Test (DEBUG)
        run: |
          echo "Шаг 1: Подготовка приватного ключа"
          # Сохраняем ключ из секрета в файл
          echo "${{ secrets.DEPLOY_KEY }}" > deploy_key
          # Устанавливаем строгие права доступа (обязательно для SSH)
          chmod 600 deploy_key
          
          echo "Шаг 2: Запуск SSH-соединения с максимальной отладкой (-vvv)"
          # Выполняем SSH-команду с флагом -vvv для самого подробного вывода
          # -o StrictHostKeyChecking=no - чтобы не спрашивать про отпечаток сервера
          # -i deploy_key - чтобы использовать наш файл с ключом
          ssh -vvv -o StrictHostKeyChecking=no -i deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo '>>> СОЕДИНЕНИЕ УСПЕШНО <<<'"
          
          echo "Шаг 3: Тест завершен"
