name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Build application
        run: npm run build:production

      - name: Verify build artifacts
        run: |
          echo "📋 Проверяем наличие билд-артефактов..."
          
          # Проверяем, что главный файл сервера существует по реальному пути
          if [ ! -f "dist/server.js" ]; then
            echo "❌ КРИТИЧЕСКАЯ ОШИБКА: Файл сервера dist/server.js не найден!"
            echo "--- Структура директории dist: ---"
            ls -R dist
            exit 1
          fi
          
          echo "✅ Все билд-артефакты найдены."
          ls -R dist

      - name: Clean up node_modules before deploy
        run: rm -rf node_modules

      - name: Deploy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # Должен быть 'daniel'
          key: ${{ secrets.DEPLOY_KEY }}
          source: "." # Копируем всю текущую директорию (без node_modules)
          target: "/var/www/app"
          overwrite: true

      - name: Install dependencies and restart application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Переходим в рабочую директорию
            cd /var/www/app

            # Устанавливаем production-зависимости
            echo "🔧 Устанавливаем зависимости..."
            npm install --production

            # Проверяем .env файл (вы должны создать его на сервере вручную)
            if [ ! -f .env ]; then
              echo "⚠️ ВНИМАНИЕ: .env файл не найден в /var/www/app/. Приложение может не запуститься."
            fi

            # Запускаем/перезапускаем приложение через PM2
            echo "🚀 Запускаем/перезапускаем приложение через PM2..."
            # УКАЗЫВАЕМ ПРАВИЛЬНЫЙ ПУТЬ К СЕРВЕРУ
            NODE_ENV=production pm2 startOrReload dist/server.js --name roleplayidentity
            
            pm2 save
            echo "✅ Деплой завершен успешно!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 5 # Даем приложению время на запуск
            
            echo "📊 Проверяем статус PM2..."
            pm2 status

            echo "🩺 Проверяем Health Check endpoint..."
            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "✅ Приложение доступно и отвечает на health check!"
            else
              echo "❌ Приложение НЕ отвечает на health check."
              echo "📋 Последние 20 строк логов PM2:"
              pm2 logs roleplayidentity --lines 20 --nostream
              exit 1
            fi