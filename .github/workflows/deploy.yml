name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm ci

      - name: Build application
        run: npm run build:production

      - name: Verify build artifacts
        run: |
          echo "📋 Проверяем наличие билд-артефактов..."
          
          # Проверяем, что главный файл сервера существует по реальному пути
          if [ ! -f "dist/apps/server/main.js" ]; then
            echo "❌ КРИТИЧЕСКАЯ ОШИБКА: Файл сервера dist/apps/server/main.js не найден!"
            echo "--- Структура директории dist: ---"
            ls -R dist
            exit 1
          fi
          
          echo "✅ Все билд-артефакты найдены."
          ls -R dist

      - name: Clean up node_modules before deploy
        run: rm -rf node_modules

      - name: Deploy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # Должен быть 'daniel'
          key: ${{ secrets.DEPLOY_KEY }}
          source: "." # Копируем всю текущую директорию (без node_modules)
          target: "/var/www/app"
          overwrite: true

      - name: Install dependencies and restart application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Переходим в рабочую директорию
            cd /var/www/app

            # Устанавливаем production-зависимости
            echo "🔧 Устанавливаем зависимости..."
            npm install --production

            # ВОТ ОНО, РЕШЕНИЕ:
            echo "🚀 Запускаем/перезапускаем приложение через PM2, ПРИНУДИТЕЛЬНО используя .env..."
            
            # Эта команда читает .env, экспортирует переменные и ЗАПУСКАЕТ PM2
            # Теперь PM2 и ваше приложение 100% увидят все переменные
            # --update-env гарантирует, что переменные применятся при перезапуске
            export $(grep -v '^#' .env | xargs) && pm2 reload roleplayidentity --update-env || pm2 start ecosystem.config.js --env production
            
            pm2 save
            echo "✅ Деплой завершен успешно!"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sleep 5 # Даем приложению время на запуск
            
            echo "📊 Проверяем статус PM2..."
            pm2 status

            echo "🩺 Проверяем Health Check endpoint..."
            if curl -f http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "✅ Приложение доступно и отвечает на health check!"
            else
              echo "❌ Приложение НЕ отвечает на health check."
              echo "📋 Последние 20 строк логов PM2:"
              pm2 logs roleplayidentity --lines 20 --nostream
              exit 1
            fi